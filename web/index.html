<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="استمع إلى تلاوات القرآن الكريم والإذاعات القرآنية، وتصفّح الأذكار والرقية الشرعية عبر تطبيق تلاوات.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="تلاوات | Telawat">
  <meta property="og:description" content="استمع إلى تلاوات القرآن الكريم والإذاعات القرآنية، وتصفّح الأذكار والرقية الشرعية عبر تطبيق تلاوات.">
  <meta property="og:url" content="https://lucky-morning-ee0c.menshawi82.workers.dev/">
  <meta property="og:image" content="https://lucky-morning-ee0c.menshawi82.workers.dev/icons/Icon-512.png">
  <meta property="og:locale" content="ar_AR">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="تلاوات | Telawat">
  <meta name="twitter:description" content="استمع إلى تلاوات القرآن الكريم والإذاعات القرآنية، وتصفّح الأذكار والرقية الشرعية عبر تطبيق تلاوات.">
  <meta name="theme-color" content="#E9EDF2">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #E9EDF2;
      color: #263238;
      font-family: Arial, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 16px;
      background: #E9EDF2;
      text-align: center;
    }

    #loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #cbd5d2;
      border-top-color: #2E7D5B;
      border-radius: 50%;
      animation: loading-spin 0.8s linear infinite;
    }

    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading-spinner {
        animation: none;
      }
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Telawat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>تلاوات | Telawat</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div id="loading-spinner" aria-hidden="true"></div>
    <p>جارٍ تحميل التطبيق...</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.remove();
      }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
